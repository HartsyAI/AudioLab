<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AudioLab session mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
/* Surfaces, deepest to highest. One cool graphite, stepped by lightness. */
--surface-well: #0d0f12;
--surface-lane: #14171b;
--surface-panel: #1b1e23;
--surface-selected: #23272e;
--surface-raised: #282c34;
--surface-raised-active: #30353d;

/* Lines. Regions are split by a line darker than both sides, never a lighter outline. */
--line: #08090b;
--lane-line: rgba(0, 0, 0, 0.5);
--grid-line: rgba(255, 255, 255, 0.03);
--grid-line-strong: rgba(255, 255, 255, 0.08);
--tick: rgba(255, 255, 255, 0.22);
--highlight: rgba(255, 255, 255, 0.06);

/* Text: neutral, four steps. */
--text: #e7e9ec;
--text-soft: #c9ced6;
--text-dim: #a8aeb7;
--text-faint: #8a919b;

/* State: the only saturated colours in the chrome. --ink is the text on any of them. */
--accent: #4a9df0;
--record: #f0524a;
--go: #45d18f;
--caution: #f3c94f;
--mute: #f29a4c;
--ink: #0b0d10;
--playhead: #ffffff;

/* Control parts. */
--control-fill: #59606b;
--control-cap: #d5dae0;

/* Identity: twelve track colours of similar weight, in hue order. */
--track-1: #ee6d86;
--track-2: #ef7d67;
--track-3: #ee9a55;
--track-4: #e3ad4f;
--track-5: #a9cf5b;
--track-6: #5fcf95;
--track-7: #4fcdb8;
--track-8: #4fbfdc;
--track-9: #6c93f2;
--track-10: #a487ee;
--track-11: #cf7de0;
--track-12: #e07ab5;

/* Type: Inter, seven sizes, three weights. */
--font-ui: Inter, "Segoe UI", system-ui, sans-serif;
--font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
--font-size-micro: 0.59375rem;
--font-size-label: 0.65625rem;
--font-size-control: 0.71875rem;
--font-size-body: 0.75rem;
--font-size-title: 0.8125rem;
--font-size-readout: 0.9375rem;
--font-size-heading: 1rem;
--font-weight-normal: 400;
--font-weight-medium: 500;
--font-weight-strong: 600;

/* Space: 2-pixel steps, named by their pixel size. */
--space-2: 0.125rem;
--space-4: 0.25rem;
--space-6: 0.375rem;
--space-8: 0.5rem;
--space-10: 0.625rem;
--space-12: 0.75rem;
--space-14: 0.875rem;
--space-16: 1rem;
--space-24: 1.5rem;

/* Size: control heights and the fixed parts of the layout. */
--control-xs: 1.125rem;
--control-sm: 1.375rem;
--control-md: 1.75rem;
--control-lg: 2rem;
--bar-height: 3.25rem;
--tab-height: 2.125rem;
--status-height: 1.5rem;
--ruler-row: 1.375rem;
--lane-height: 4rem;
--header-column: 15.5rem;
--strip-width: 6.5rem;
--automation-height: 2.5rem;

/* Shape and depth. */
--radius-xs: 0.125rem;
--radius-sm: 0.25rem;
--radius-md: 0.375rem;
--radius-lg: 0.5rem;
--radius-round: 999px;
--shadow-raised: inset 0 1px 0 var(--highlight);
--shadow-well: inset 0 0 0 1px var(--line), inset 0 2px 5px rgba(0, 0, 0, 0.55);
--shadow-cap: 0 2px 3px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 0 rgba(0, 0, 0, 0.25);
--shadow-overlay: 0 0 0 1px var(--line), 0 12px 32px rgba(0, 0, 0, 0.6);
--focus-ring: 0 0 0 2px var(--accent);

/* Stacking, lowest to highest. */
--z-lane-overlay: 10;
--z-sticky: 20;
--z-popover: 100;
--z-dialog: 200;
--z-toast: 300;
--z-tooltip: 400;

/* Motion. */
--motion-fast: 80ms;
--motion-base: 160ms;
}
html,body,#app{height:100%}
body{margin:0;background:var(--surface-lane)}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer}
textarea{font:inherit}
footer{padding-right:176px !important}
#swatches{position:fixed;right:12px;bottom:0;height:24px;display:flex;gap:6px;align-items:center;font:500 10.5px Inter,system-ui,sans-serif;color:var(--text-faint)}
#swatches button{width:12px;height:12px;border-radius:6px}
</style>
</head>
<body>
<!-- A design mock, not product code: the look reference for DESIGN.md section 7. The small script below only expands the repeated rows. -->
<template id="tpl">
<div style="height: 100%; min-height: 820px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface-lane); color: var(--text); font-family: var(--font-ui); font-size: var(--font-size-body); line-height: 1.2; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">

<header style="flex: none; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--surface-panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow-raised)">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 26px; height: 26px; border-radius: var(--radius-md); background: var(--accent); display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="stroke: var(--ink)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 7v2M5.5 4.5v7M8.5 2.5v11M11.5 5v6M14 7v2"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: var(--font-size-title); font-weight: var(--font-weight-strong); letter-spacing: -0.01em">Midnight Drive</span>
<span style="font-size: var(--font-size-label); color: var(--text-faint)">Saved 12 s ago</span>
</div>
</div>

<div style="display: flex; gap: 2px; padding: 2px; border-radius: var(--radius-lg); background: var(--surface-well); box-shadow: var(--shadow-well)">
<button aria-label="Go to start" style="width: 34px; height: 28px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-raised); display: flex; align-items: center; justify-content: center; color: var(--text-soft)"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="2" y="2.5" width="1.8" height="9" rx="0.6"></rect><polygon points="12,2.5 12,11.5 5,7"></polygon></svg></button>
<button aria-label="Stop" style="width: 34px; height: 28px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-raised); display: flex; align-items: center; justify-content: center; color: var(--text-soft)"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.2"></rect></svg></button>
<button aria-label="Play" style="width: 40px; height: 28px; border-radius: var(--radius-md); background: var(--go); display: flex; align-items: center; justify-content: center; color: var(--ink)"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><polygon points="4,2.2 12,7 4,11.8"></polygon></svg></button>
<button aria-label="Record" style="width: 34px; height: 28px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-raised); display: flex; align-items: center; justify-content: center; color: var(--record)"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><circle cx="7" cy="7" r="4.2"></circle></svg></button>
</div>

<div style="display: flex; align-items: stretch; height: 36px; border-radius: var(--radius-lg); background: var(--surface-well); box-shadow: var(--shadow-well)">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 14px; border-right: 1px solid var(--surface-panel)">
<span style="font-size: var(--font-size-micro); font-weight: var(--font-weight-strong); letter-spacing: 0.08em; color: var(--text-faint)">TIME</span>
<span style="font-size: var(--font-size-readout); font-weight: var(--font-weight-strong)">0:00:18.500</span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 14px; border-right: 1px solid var(--surface-panel)">
<span style="font-size: var(--font-size-micro); font-weight: var(--font-weight-strong); letter-spacing: 0.08em; color: var(--text-faint)">BARS</span>
<span style="font-size: var(--font-size-readout); font-weight: var(--font-weight-strong)">10.2.1</span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 12px; border-right: 1px solid var(--surface-panel)">
<span style="font-size: var(--font-size-micro); font-weight: var(--font-weight-strong); letter-spacing: 0.08em; color: var(--text-faint)">TEMPO</span>
<span style="font-size: var(--font-size-body); font-weight: var(--font-weight-strong); color: var(--text-soft)">120.00</span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 12px; border-right: 1px solid var(--surface-panel)">
<span style="font-size: var(--font-size-micro); font-weight: var(--font-weight-strong); letter-spacing: 0.08em; color: var(--text-faint)">METER</span>
<span style="font-size: var(--font-size-body); font-weight: var(--font-weight-strong); color: var(--text-soft)">4/4</span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 12px">
<span style="font-size: var(--font-size-micro); font-weight: var(--font-weight-strong); letter-spacing: 0.08em; color: var(--text-faint)">KEY</span>
<span style="font-size: var(--font-size-body); font-weight: var(--font-weight-strong); color: var(--text-soft)">A min</span>
</div>
</div>

<div style="display: flex; gap: 4px">
<button style="height: 28px; padding: 0 12px; border-radius: var(--radius-md); background: var(--accent); color: var(--ink); font-size: var(--font-size-control); font-weight: var(--font-weight-strong)">Loop</button>
<button style="height: 28px; padding: 0 12px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-raised); color: var(--text-dim); font-size: var(--font-size-control); font-weight: var(--font-weight-strong)">Click</button>
<button style="height: 28px; padding: 0 12px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-raised); color: var(--text-dim); font-size: var(--font-size-control); font-weight: var(--font-weight-strong)">Punch</button>
<button style="height: 28px; padding: 0 12px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-raised); color: var(--text-dim); font-size: var(--font-size-control); font-weight: var(--font-weight-strong)">Follow</button>
</div>

<div style="flex: 1"></div>

<div style="display: flex; gap: 2px; padding: 2px; border-radius: var(--radius-lg); background: var(--surface-well); box-shadow: var(--shadow-well)">
<button aria-label="Pointer tool" style="width: 30px; height: 24px; border-radius: var(--radius-md); background: var(--surface-raised-active); box-shadow: var(--shadow-raised); display: flex; align-items: center; justify-content: center; color: var(--text)"><svg width="13" height="13" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><polygon points="3,1.5 11.5,8 7.6,8.4 9.6,12.4 8,13.1 6.1,9.1 3,11.6"></polygon></svg></button>
<button aria-label="Range tool" style="width: 30px; height: 24px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--text-faint)"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4.5 2h5M7 2v10M4.5 12h5"></path></svg></button>
</div>
<button style="height: 28px; padding: 0 10px; border-radius: var(--radius-md); background: var(--surface-raised); box-shadow: var(--shadow-raised); display: flex; align-items: center; gap: 8px; font-size: var(--font-size-control); font-weight: var(--font-weight-medium); color: var(--text-soft)"><span style="color: var(--text-dim)">Grid</span><span>1/16</span><svg width="9" height="9" viewBox="0 0 10 10" fill="none" style="stroke: var(--text-faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5l3 3 3-3"></path></svg></button>

<div style="display: flex; align-items: center">
<div style="width: 24px; height: 24px; border-radius: var(--radius-round); background: var(--surface-raised-active); box-shadow: 0 0 0 2px var(--surface-panel); display: flex; align-items: center; justify-content: center; font-size: var(--font-size-micro); font-weight: var(--font-weight-strong); color: var(--text)">You</div>
<div style="width: 24px; height: 24px; border-radius: var(--radius-round); margin-left: -6px; background: var(--track-10); box-shadow: 0 0 0 2px var(--surface-panel); display: flex; align-items: center; justify-content: center; font-size: var(--font-size-micro); font-weight: var(--font-weight-strong); color: var(--ink)">AI</div>
</div>
<button style="height: 28px; padding: 0 14px; border-radius: var(--radius-md); background: var(--accent); color: var(--ink); font-size: var(--font-size-control); font-weight: var(--font-weight-strong)">Export</button>
</header>

<div style="flex: none; display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 44px; background: var(--surface-panel); border-bottom: 1px solid var(--line)">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 12px; border-right: 1px solid var(--line)">
<span style="font-size: var(--font-size-label); font-weight: var(--font-weight-strong); letter-spacing: 0.06em; color: var(--text-faint)">TRACKS</span>
<button style="height: 22px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--surface-raised); box-shadow: var(--shadow-raised); display: flex; align-items: center; gap: 6px; font-size: var(--font-size-control); font-weight: var(--font-weight-medium); color: var(--text-soft)"><svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 1.5v7M1.5 5h7"></path></svg><span>Add track</span></button>
</div>
<div style="position: relative; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 21px; border-bottom: 1px solid var(--line)">
<sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
<div style="position: absolute; left: {{s.x}}px; width: {{s.w}}px; top: 3px; height: 15px; box-sizing: border-box; border-radius: var(--radius-sm); padding: 0 6px; background: {{s.bg}}; color: {{s.fg}}; font-size: var(--font-size-label); font-weight: var(--font-weight-strong); line-height: 15px; white-space: nowrap; overflow: hidden">{{s.name}}</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; top: 22px; height: 22px">
<div style="position: absolute; left: {{loopX}}px; width: {{loopW}}px; top: 0; bottom: 0; box-sizing: border-box; background: color-mix(in srgb, var(--accent) 30%, transparent); border-left: 2px solid var(--accent); border-right: 2px solid var(--accent)"></div>
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="18">
<span style="position: absolute; left: {{b.x}}px; top: 0; height: 22px; box-sizing: border-box; padding-left: 6px; border-left: 1px solid {{b.tick}}; font-size: var(--font-size-label); font-weight: var(--font-weight-medium); line-height: 22px; color: {{b.fg}}">{{b.n}}</span>
</sc-for>
<svg width="11" height="8" viewBox="0 0 11 8" aria-hidden="true" style="position: absolute; left: {{headCapX}}px; bottom: 0; display: block"><polygon points="0,0 11,0 5.5,8" style="fill: var(--playhead)"></polygon></svg>
</div>
</div>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 248px minmax(0, 1fr)">
<div style="background: var(--surface-panel); border-right: 1px solid var(--line); overflow: hidden">
<sc-for list="{{ tracks }}" as="t" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 4px 26px minmax(0, 1fr) 18px; height: 64px; box-sizing: border-box; border-bottom: 1px solid var(--line); background: {{t.headBg}}">
<div style="background: {{t.color}}"></div>
<div style="padding-top: 14px; text-align: center; font-size: var(--font-size-label); font-weight: var(--font-weight-medium); color: var(--text-faint)">{{t.n}}</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 8px; min-width: 0; padding-right: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="flex: 1; min-width: 0; font-size: var(--font-size-body); font-weight: var(--font-weight-strong); letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
<div style="display: flex; gap: 4px">
<button aria-label="Mute" style="width: 20px; height: 18px; border-radius: var(--radius-sm); background: {{t.mBg}}; color: {{t.mFg}}; box-shadow: var(--shadow-raised); font-size: var(--font-size-label); font-weight: var(--font-weight-strong)">M</button>
<button aria-label="Solo" style="width: 20px; height: 18px; border-radius: var(--radius-sm); background: {{t.sBg}}; color: {{t.sFg}}; box-shadow: var(--shadow-raised); font-size: var(--font-size-label); font-weight: var(--font-weight-strong)">S</button>
<button aria-label="Record arm" style="width: 20px; height: 18px; border-radius: var(--radius-sm); background: {{t.rBg}}; color: {{t.rFg}}; box-shadow: var(--shadow-raised); font-size: var(--font-size-label); font-weight: var(--font-weight-strong)">R</button>
<button aria-label="Input monitor" style="width: 20px; height: 18px; border-radius: var(--radius-sm); background: {{t.iBg}}; color: {{t.iFg}}; box-shadow: var(--shadow-raised); font-size: var(--font-size-label); font-weight: var(--font-weight-strong)">I</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 78px; font-size: var(--font-size-label); color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span>
<div style="flex: 1; position: relative; height: 4px; border-radius: var(--radius-xs); background: var(--surface-well)">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{t.vol}}%; border-radius: var(--radius-xs); background: var(--control-fill)"></div>
<div style="position: absolute; left: {{t.vol}}%; top: -4px; width: 4px; height: 12px; margin-left: -2px; border-radius: var(--radius-xs); background: var(--control-cap); box-shadow: var(--shadow-cap)"></div>
</div>
<span style="width: 34px; text-align: right; font-size: var(--font-size-label); font-weight: var(--font-weight-medium); color: var(--text-dim)">{{t.db}}</span>
</div>
</div>
<div style="display: flex; gap: 2px; padding: 8px 6px 8px 0">
<div style="flex: 1; position: relative; border-radius: var(--radius-xs); overflow: hidden; background: linear-gradient(to top, var(--go) 0%, var(--go) 68%, var(--caution) 68%, var(--caution) 90%, var(--record) 90%)"><div style="position: absolute; left: 0; right: 0; top: 0; height: {{t.coverL}}%; background: var(--surface-well)"></div></div>
<div style="flex: 1; position: relative; border-radius: var(--radius-xs); overflow: hidden; background: linear-gradient(to top, var(--go) 0%, var(--go) 68%, var(--caution) 68%, var(--caution) 90%, var(--record) 90%)"><div style="position: absolute; left: 0; right: 0; top: 0; height: {{t.coverR}}%; background: var(--surface-well)"></div></div>
</div>
</div>
</sc-for>
</div>

<div style="position: relative; overflow: hidden; background-color: var(--surface-lane); background-image: linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: 272px 100%, 68px 100%">
<sc-for list="{{ tracks }}" as="t" hint-placeholder-count="6">
<div style="position: relative; height: 64px; box-sizing: border-box; border-bottom: 1px solid var(--lane-line); background: {{t.laneBg}}">
<sc-for list="{{ t.clips }}" as="c" hint-placeholder-count="2">
<div style="position: absolute; left: {{c.x}}px; width: {{c.w}}px; top: 4px; bottom: 4px; border-radius: var(--radius-sm); overflow: hidden; display: flex; flex-direction: column; background: {{c.body}}; box-shadow: {{c.ring}}; opacity: {{c.opacity}}">
<div style="flex: none; height: 16px; padding: 0 6px; background: {{c.head}}; color: var(--ink); font-size: var(--font-size-label); font-weight: var(--font-weight-strong); line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</div>
<div style="flex: 1; min-height: 0; position: relative">
<sc-if value="{{ c.isAudio }}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block"><path d="{{c.path}}" style="fill: {{c.wave}}"></path></svg>
</sc-if>
<sc-if value="{{ c.isMidi }}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ c.notes }}" as="nt" hint-placeholder-count="12">
<div style="position: absolute; left: {{nt.x}}%; top: {{nt.y}}%; width: {{nt.w}}%; height: 3px; border-radius: var(--radius-xs); background: {{c.wave}}"></div>
</sc-for>
</sc-if>
</div>
</div>
</sc-for>
</div>
</sc-for>
<div style="position: absolute; left: {{loopX}}px; width: {{loopW}}px; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 9%, transparent); pointer-events: none"></div>
<div style="position: absolute; left: {{headX}}px; top: 0; bottom: 0; width: 1px; background: var(--playhead); pointer-events: none"></div>
</div>
</div>

<div style="flex: none; height: 292px; display: flex; flex-direction: column; background: var(--surface-panel); border-top: 1px solid var(--line); box-shadow: var(--shadow-raised)">
<div style="flex: none; height: 34px; display: flex; align-items: stretch; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line)">
<button style="padding: 0 12px; font-size: var(--font-size-body); font-weight: var(--font-weight-strong); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent)">Mixer</button>
<button style="padding: 0 12px; font-size: var(--font-size-body); font-weight: var(--font-weight-medium); color: var(--text-dim)">Clip editor</button>

<script>
class DCLogic { constructor() { this.props = {}; } }
class Component extends DCLogic {
rgba(colour, alpha) {

}
rng(seed) {

wave(seed, n, kind) {

} else {
const phrase = i % 46;
env += (r() - 0.5) * 0.3;
env = Math.max(0.25, Math.min(0.92, env));
const gate = phrase > 37 ? 0.06 : Math.sin((phrase / 37) * Math.PI) * 0.75 + 0.25;
v = env * gate * (0.6 + 0.4 * r());
}
a.push(Math.max(0.03, Math.min(1, v)));
}
let top = 'M0,50';
let bottom = '';
for (let i = 0; i < n; i++) {
const x = ((i / (n - 1)) * 1000).toFixed(1);
top += ' L' + x + ',' + (50 - a[i] * 44).toFixed(1);
bottom = ' L' + x + ',' + (50 + a[i] * 44).toFixed(1) + bottom;
}
return top + bottom + ' Z';
}
notes(seed, bars) {
const r = this.rng(seed * 104729 + 7);
const out = [];
const steps = bars * 2;
const rows = [[22, 44, 66], [30, 52, 74], [16, 38, 60], [26, 48, 70]];

const chord = rows[Math.floor(i / 2) % rows.length];
const hold = r() > 0.35 ? 1 : 0.6;
for (let k = 0; k < 3; k++) {
out.push({ x: ((i / steps) * 100 + 0.4).toFixed(2), y: chord[k], w: ((100 / steps) * hold - 0.8).toFixed(2) });
}
}
return out;
}
build() {
const BAR = 68;
const self = this;
const off = { bg: 'var(--surface-raised)', fg: 'var(--text-dim)' };
const ink = 'var(--ink)';
const defs = [
{ n: 1, name: 'Lead vocal', sub: 'In 1 · Mic', color: 'var(--track-2)', kind: 'vocal', db: '-6.0', vol: 62, mL: 58, mR: 52, pan: 0, rec: true, mon: true, slots: ['EQ', 'Compressor'], clips: [{ b: 5, l: 4, name: 'Verse 1 · take 3' }, { b: 9, l: 4, name: 'Chorus · take 2' }, { b: 13, l: 4, name: 'Verse 2 · take 1' }] },
{ n: 2, name: 'Backing vocals', sub: 'In 2 · Mic', color: 'var(--track-4)', kind: 'vocal', db: '-11.5', vol: 46, mL: 31, mR: 35, pan: -28, slots: ['EQ', 'Reverb send'], clips: [{ b: 9, l: 4, name: 'Chorus stack' }, { b: 17, l: 2, name: 'Bridge oohs' }] },
{ n: 3, name: 'Guitar', sub: 'In 3 · DI', color: 'var(--track-6)', kind: 'guitar', db: '-8.2', vol: 56, mL: 47, mR: 50, pan: 34, selected: true, slots: ['Saturation', 'Delay send'], clips: [{ b: 1, l: 8, name: 'Rhythm guitar', sel: true }, { b: 9, l: 8, name: 'Rhythm guitar · chorus' }] },
{ n: 4, name: 'Keys', sub: 'Analog pad', color: 'var(--track-8)', kind: 'midi', db: '-9.0', vol: 53, mL: 38, mR: 36, pan: -12, slots: ['Analog pad', 'EQ'], clips: [{ b: 5, l: 8, name: 'Pad chords' }, { b: 13, l: 6, name: 'Pad chords · lift' }] },
{ n: 5, name: 'Bass', sub: 'Generated', color: 'var(--track-9)', kind: 'bass', db: '-7.4', vol: 58, mL: 0, mR: 0, pan: 0, muted: true, slots: ['Compressor', ''], clips: [{ b: 1, l: 16, name: 'Bassline v2 · ACE-Step' }] },
{ n: 6, name: 'Drums', sub: 'Stem · kit', color: 'var(--track-10)', kind: 'drums', db: '-4.8', vol: 66, mL: 72, mR: 69, pan: 0, slots: ['EQ', 'Compressor'], clips: [{ b: 1, l: 4, name: 'Kit intro' }, { b: 5, l: 14, name: 'Kit loop' }] }
];
let seed = 1;
const tracks = defs.map(function (d) {
return {
n: d.n, name: d.name, sub: d.sub, color: d.color, db: d.db, vol: d.vol,
coverL: 100 - d.mL, coverR: 100 - d.mR,
headBg: d.selected ? 'var(--surface-selected)' : 'var(--surface-panel)',
laneBg: d.selected ? 'color-mix(in srgb, var(--playhead) 3%, transparent)' : 'transparent',

sBg: off.bg, sFg: off.fg,
rBg: d.rec ? 'var(--record)' : off.bg, rFg: d.rec ? ink : off.fg,
iBg: d.mon ? 'var(--go)' : off.bg, iFg: d.mon ? ink : off.fg,

seed += 1;
const w = c.l * BAR - 2;
const midi = d.kind === 'midi';
return {
name: c.name, x: (c.b - 1) * BAR + 1, w: w,
body: self.rgba(d.color, c.sel ? 0.3 : 0.17),
head: d.color, wave: d.color,
ring: c.sel ? 'inset 0 0 0 1.5px var(--playhead)' : 'inset 0 0 0 1px ' + self.rgba(d.color, 0.5),
opacity: d.muted ? 0.4 : 1,
isAudio: !midi, isMidi: midi,
path: midi ? '' : self.wave(seed, Math.max(24, Math.round(w / 2.6)), d.kind),
notes: midi ? self.notes(seed, c.l) : []
};
})
};
});
const strip = function (d) {
return {
name: d.name, color: d.color, width: 104, bg: 'transparent', db: d.db,
fader: Math.round(d.vol * 0.86 + 4), pan: d.pan,
panText: d.pan === 0 ? 'C' : (d.pan < 0 ? 'L' + Math.round(-d.pan * 0.75) : 'R' + Math.round(d.pan * 0.75)),

};
};
const strips = defs.map(strip);
strips.push(strip({ name: 'Reverb', color: 'var(--text-faint)', db: '-12.0', vol: 44, mL: 26, mR: 29, pan: 0, slots: ['Plate reverb', 'EQ'] }));

const master = strip({ name: 'Master', color: 'var(--text)', db: '-1.2', vol: 74, mL: 79, mR: 77, pan: 0, slots: ['Limiter', 'Loudness meter'] });

master.bg = 'var(--surface-selected)';
strips.push(master);
const bars = [];
for (let i = 0; i < 24; i++) {
const strong = i % 4 === 0;
bars.push({ n: i + 1, x: i * BAR, tick: strong ? 'var(--tick)' : 'var(--grid-line-strong)', fg: strong ? 'var(--text-soft)' : 'var(--text-faint)' });
}
const sectionDefs = [['Intro', 1, 4, 'var(--text-faint)'], ['Verse 1', 5, 4, 'var(--track-9)'], ['Chorus', 9, 4, 'var(--track-12)'], ['Verse 2', 13, 4, 'var(--track-9)'], ['Bridge', 17, 4, 'var(--track-4)']];
const sections = sectionDefs.map(function (s) {
return { name: s[0], x: (s[1] - 1) * BAR + 1, w: s[2] * BAR - 2, bg: self.rgba(s[3], 0.22), fg: 'var(--text)' };
});
return { tracks: tracks, strips: strips, bars: bars, sections: sections, loopX: 8 * BAR, loopW: 4 * BAR, headX: Math.round(9.25 * BAR), headCapX: Math.round(9.25 * BAR) - 5 };
}
renderVals() {
if (!this.sessionModel) { this.sessionModel = this.build(); }
const accent = "var(--accent)";
return Object.assign({}, this.sessionModel, { accent: accent, accentWash: this.rgba(accent, 0.09), accentBand: this.rgba(accent, 0.3) });
}
}
function lookup(scope, path) {
  path = path.replace(/[{}]/g, '').trim();
  if (path === 'true') return true;
  if (path === 'false') return false;
  return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
}
function fill(text, scope) {
  return text.replace(/\{\{([^}]+)\}\}/g, function (m, p) { const v = lookup(scope, p); return v == null ? '' : v; });

function render(node, scope, out) {
  node.childNodes.forEach(function (child) {
    if (child.nodeType === 3) { out.appendChild(document.createTextNode(fill(child.nodeValue, scope))); return; }
    if (child.nodeType !== 1) return;
    if (child.localName === 'sc-for') {

    if (child.localName === 'sc-if') { if (lookup(scope, child.getAttribute('value'))) render(child, scope, out); return; }

    out.appendChild(el);

}
const component = new Component();
function draw(accent) {
  if (accent) { document.documentElement.style.setProperty('--accent', accent); }

  app.textContent = '';
  render(document.getElementById('tpl').content, component.renderVals(), app);
}
